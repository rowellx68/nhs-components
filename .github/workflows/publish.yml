name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # least privilege; each job grants its own scopes

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commit/tags via changesets
      pull-requests: write # open/update the version PR via changesets
      id-token: write # OIDC for npm provenance (provenance: true)
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # persist-credentials is set to true: changesets/action pushes the version
          # branch and release tags via plain `git push`, which relies on the
          # checkout-persisted token for auth.
          persist-credentials: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1
        id: changesets
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_storybook:
    name: publish_storybook
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ needs.publish.outputs.published == 'true' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write # push built Storybook to the gh-pages branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          cache: 'pnpm'
          cache-dependency-path: './pnpm-lock.yaml'

      - run: pnpm install --frozen-lockfile

      - run: |
          pnpm -F ./packages/react sb:build -o ./out-sb
          touch ./packages/react/out-sb/.nojekyll

      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445
        with:
          folder: ./packages/react/out-sb
